[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeospatial"
version = "0.1.0"
description = "Comprehensive geospatial analysis package with multi-core CPU and GPU support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Py-GeoSpatial Contributors"}
]
keywords = ["gis", "geospatial", "raster", "vector", "pointcloud", "lidar", "gpu", "parallel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "shapely>=1.8.0",
    "gdal>=3.3.0",
    "pyproj>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
]

io = [
    "rasterio>=1.2.0",
    "fiona>=1.8.0",
    "geopandas>=0.10.0",
]

compute = [
    "cupy-cuda11x>=10.0.0",
    "numba>=0.56.0",
    "dask>=2021.10.0",
]

viz = [
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "folium>=0.12.0",
    "pyvista>=0.35.0",
]

whitebox = [
    "whitebox>=2.0.0",
]

all = [
    "pygeospatial[dev,io,compute,viz,whitebox]",
]

[project.urls]
Homepage = "https://github.com/yourusername/Py-GeoSpatial"
Documentation = "https://Py-GeoSpatial.readthedocs.io"
Repository = "https://github.com/yourusername/Py-GeoSpatial"
"Bug Tracker" = "https://github.com/yourusername/Py-GeoSpatial/issues"

[tool.setuptools]
packages = ["pygeospatial"]

[tool.setuptools_scm]
write_to = "pygeospatial/_version.py"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pygeospatial --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
